name: mro_damage_system
description: Sistema profesional de levantamiento de daños carreteros para MRO
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ═══════════════════════════════════════════════
  # FIREBASE — Backend completo
  # ═══════════════════════════════════════════════
  firebase_core: ^4.9.0           # Núcleo de Firebase (siempre necesario)
  firebase_auth: ^6.5.1           # Autenticación (login/logout)
  cloud_firestore: ^6.4.1         # Base de datos Firestore
  firebase_storage: ^13.4.1       # Almacenamiento de fotos
  cloud_functions: ^6.3.1         # Funciones en la nube

  # ═══════════════════════════════════════════════
  # ESTADO — Riverpod para manejo de estado
  # ═══════════════════════════════════════════════
  flutter_riverpod: ^3.0.0-dev.3        # Manejo de estado principal
  riverpod_annotation: ^3.0.0-dev.3     # Anotaciones para Riverpod

  # ═══════════════════════════════════════════════
  # ALMACENAMIENTO LOCAL — Modo offline
  # ═══════════════════════════════════════════════
  hive: ^2.2.3                    # Base de datos local clave-valor
  hive_flutter: ^1.1.0            # Integración Hive + Flutter
  shared_preferences: ^2.3.2      # Preferencias simples (sesión, config)

  # ═══════════════════════════════════════════════
  # NAVEGACIÓN — Rutas de la app
  # ═══════════════════════════════════════════════
  go_router: ^17.2.3              # Navegación declarativa moderna

  # ═══════════════════════════════════════════════
  # CÁMARA Y ARCHIVOS
  # ═══════════════════════════════════════════════
  image_picker: ^1.1.2            # Seleccionar foto de cámara o galería
  camera: ^0.12.0+1               # Control directo de cámara
  image: ^4.2.0                   # Procesamiento de imágenes
  image_cropper: ^12.2.1           # Recortar imágenes
  cached_network_image: ^3.4.1    # Cache de imágenes de red
  photo_view: ^0.15.0             # Visualizador de fotos con zoom

  # ═══════════════════════════════════════════════
  # GPS Y MAPAS
  # ═══════════════════════════════════════════════
  geolocator: ^14.0.2             # Obtener coordenadas GPS
  geocoding: ^4.0.0               # Convertir coordenadas a dirección
  google_maps_flutter: ^2.9.0     # Mapa interactivo (opcional)

  # ═══════════════════════════════════════════════
  # GENERACIÓN DE PDFs
  # ═══════════════════════════════════════════════
  pdf: ^3.11.1                    # Crear PDFs
  printing: ^5.13.2               # Imprimir y compartir PDFs

  # ═══════════════════════════════════════════════
  # UI Y DISEÑO
  # ═══════════════════════════════════════════════
  flutter_svg: ^2.0.10+1         # Imágenes SVG (logos, iconos)
  lottie: ^3.1.3                  # Animaciones Lottie
  shimmer: ^3.0.0                 # Efecto de carga tipo skeleton
  flutter_spinkit: ^5.2.1         # Indicadores de carga
  badges: ^3.1.2                  # Badges/notificaciones en iconos
  flutter_slidable: ^4.0.3        # Acciones deslizables en listas
  expansion_tile_card: ^3.0.0     # Tarjetas expandibles

  # ═══════════════════════════════════════════════
  # FORMULARIOS Y VALIDACIÓN
  # ═══════════════════════════════════════════════
  reactive_forms: ^18.2.2         # Formularios reactivos (más robusto que Form)
  mask_text_input_formatter: ^2.9.0  # Formateo de campos (KM: 000+000)

  # ═══════════════════════════════════════════════
  # FIRMA DIGITAL
  # ═══════════════════════════════════════════════
  signature: ^6.3.0               # Campo de firma digital

  # ═══════════════════════════════════════════════
  # CONECTIVIDAD Y RED
  # ═══════════════════════════════════════════════
  connectivity_plus: ^7.1.1       # Detectar si hay internet
  dio: ^5.7.0                     # HTTP client avanzado

  # ═══════════════════════════════════════════════
  # UTILIDADES
  # ═══════════════════════════════════════════════
  intl: ^0.20.2                   # Fechas, moneda, internacionalización
  uuid: ^4.5.1                    # Generar IDs únicos
  equatable: ^2.0.7               # Comparación de objetos
  dartz: ^0.10.1                  # Programación funcional (Either, Option)
  get_it: ^9.2.1                  # Inyección de dependencias
  injectable: ^2.5.0              # Anotaciones para inyección
  logger: ^2.4.0                  # Logs profesionales
  flutter_dotenv: ^6.0.1          # Variables de entorno
  path_provider: ^2.1.4           # Rutas de archivos del sistema
  open_file: ^3.5.5               # Abrir archivos (PDFs)
  share_plus: ^12.0.2             # Compartir archivos
  url_launcher: ^6.3.1            # Abrir URLs y emails
  permission_handler: ^12.0.1     # Permisos de cámara, GPS, etc.
  crypto: ^3.0.5                  # Hash para seguridad
  json_annotation: ^4.9.0         # Serialización JSON

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0           # Reglas de código limpio
  
  # Generadores de código (no van en el app final)
  build_runner: ^2.4.12           # Ejecuta generadores de código
  hive_generator: ^2.0.1          # Genera adaptadores para Hive
  riverpod_generator: ^3.0.0-dev.11      # Genera providers de Riverpod
  injectable_generator: ^2.6.2    # Genera inyección de dependencias
  json_serializable: ^6.8.0       # Genera código de serialización JSON
  mockito: ^5.4.4                 # Para testing (mocks)

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env
fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700